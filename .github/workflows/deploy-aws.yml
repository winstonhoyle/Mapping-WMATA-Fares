name: WMATA Deployment Pipeline

on:
  push:
    branches:
      - main
      - Migration-aws

jobs:

  deploy-aws:
    name: Deploy Lambda
    runs-on: ubuntu-latest
    env:
      LAMBDA_FUNCTION_NAME: wmata-fares-api-lambda
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      #### Lambda Function ####
      - name: Install dependencies and build ZIP
        id: build-lambda
        run: |
          sh lambda/build.sh
          echo "lambda_zip_path=$(pwd)/lambda/lambda_package.zip" >> $GITHUB_ENV

      - name: Update Lambda Function
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://lambda/lambda_package.zip \
            --region $AWS_REGION


      #### Terraform ####
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Validate
        working-directory: infra
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra
        env:
          TF_VAR_cloudflare_zone_io_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform plan -var "lambda_zip_path=$lambda_zip_path" -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        working-directory: infra
        env:
          TF_VAR_cloudflare_zone_io_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform apply -var "lambda_zip_path=$lambda_zip_path" -auto-approve tfplan