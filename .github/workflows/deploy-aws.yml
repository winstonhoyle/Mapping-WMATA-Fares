name: WMATA Deployment Pipeline

on:
  push:
    branches:
      - main

jobs:

  deploy-lambda:
    name: Deploy Lambda
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Lambda dependencies
        run: pip install -r lambda/requirements.txt

      - name: Package Lambda
        run: |
          mkdir -p package
          cp -r lambda/* package/
          pip install --target ./package -r lambda/requirements.txt
          cd package
          zip -r ../lambda.zip .
          cd ..

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name WMATA-fare-api \
            --zip-file fileb://lambda.zip \
            --region $AWS_REGION

  deploy-glue-etl:
    name: Deploy Glue ETL
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: wmata-fares
      S3_PREFIX: glue
      WMATA_API_TOKEN: ${{ secrets.WMATA_API_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Glue dependencies
        run: pip install -r glue/requirements.txt

      - name: Upload Glue Job Script to S3
        run: |
          aws s3 cp glue/glue_etl.py s3://$S3_BUCKET/$S3_PREFIX/glue_etl.py

      - name: Update Glue Job
        run: |
          aws glue update-job \
            --job-name WMATA-ETL-Job \
            --job-update "{
              \"Command\": {
                \"Name\": \"glueetl\",
                \"ScriptLocation\": \"s3://$S3_BUCKET/$S3_PREFIX/glue_etl.py\",
                \"PythonVersion\": \"3\"
              },
              \"DefaultArguments\": {
                \"--S3_BUCKET\": \"$S3_BUCKET\",
                \"--S3_PREFIX\": \"$S3_PREFIX\",
                \"--WMATA_API_TOKEN\": \"$WMATA_API_TOKEN\"
              }
            }" \
            --region $AWS_REGION

  build-and-deploy:
    name: Deploy React Frontend to S3
    runs-on: ubuntu-latest
    env:
      S3_BUCKET: wmata-fares
      S3_PREFIX: app
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build React app
        working-directory: app
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync app/build/ s3://$S3_BUCKET/$S3_PREFIX/ \
            --delete \
            --acl public-read
