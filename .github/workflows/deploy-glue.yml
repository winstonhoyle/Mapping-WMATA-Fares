name: Deploy Glue ETL

on:
  push:
    branches: [main]

jobs:
  name: Deploy Glue ETL
  runs-on: ubuntu-latest
  needs: deploy-lambda
  env:
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    AWS_REGION: ${{ secrets.AWS_REGION }}
    S3_BUCKET: wmata-fares
    S3_PREFIX: glue
    WMATA_API_TOKEN: ${{ secrets.WMATA_API_TOKEN }}
  steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Upload Glue Job Script to S3
      run: |
        aws s3 cp glue/glue_etl.py s3://$S3_BUCKET/$S3_PREFIX/glue_etl.py

    - name: Update Glue Job
      run: |
        aws glue update-job \
          --job-name WMATA-ETL-Job \
          --job-update "{
            \"Command\": {
              \"Name\": \"glueetl\",
              \"ScriptLocation\": \"s3://$S3_BUCKET/$S3_PREFIX/glue_etl.py\",
              \"PythonVersion\": \"3\"
            },
            \"DefaultArguments\": {
              \"--S3_BUCKET\": \"$S3_BUCKET\",
              \"--S3_PREFIX\": \"$S3_PREFIX\",
              \"--WMATA_API_TOKEN\": \"$WMATA_API_TOKEN\"
            }
          }" \
          --region $AWS_REGION
          