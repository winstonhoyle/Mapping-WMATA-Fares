openapi: 3.0.3
info:
  title: WMATA Fares API
  version: "1.0"
  description: |
    Metrorail stations, lines, and station-to-station fares, copied from WMATA's API and Open Data DC
    a few times a year.

    Each IP may make 100 requests in 10 seconds; after that, its requests get `429` for 10 seconds.
    Responses are cached for an hour. Cache them on your side too.
# Public, no key.
security: []
servers:
  - url: https://api.wmatafares.com
components:
  responses:
    NotFound:
      description: Unknown station or path
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limit exceeded. Back off and retry.
  schemas:
    Error:
      type: object
      properties:
        error: { type: string, example: Station not found }
    Fare:
      type: object
      properties:
        PeakTime: { type: number, description: Peak fare in dollars, example: 2.0 }
        OffPeakTime: { type: number, description: Off-peak fare in dollars, example: 2.0 }
        SeniorDisabled: { type: number, description: Senior and disabled fare in dollars, example: 1.1 }
        RailTime: { type: integer, description: "Scheduled minutes in the train, without waits or transfers", example: 2 }
        CompositeMiles: { type: number, description: WMATA's fare distance in miles, example: 0.75 }
paths:
  /stations:
    get:
      operationId: getStations
      summary: Stations
      description: One point per station platform code. A transfer station has two codes, linked by `StationTogether1`.
      responses:
        "200":
          description: GeoJSON FeatureCollection of station points
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string, example: FeatureCollection }
                  features:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string, example: Feature }
                        geometry:
                          type: object
                          properties:
                            type: { type: string, example: Point }
                            coordinates:
                              type: array
                              items: { type: number }
                              example: [-77.028099, 38.898303]
                        properties:
                          type: object
                          properties:
                            Code: { type: string, example: A01 }
                            Name: { type: string, example: Metro Center }
                            StationTogether1: { type: string, description: "The other platform's code, or empty", example: C01 }
                            LineCode1: { type: string, nullable: true, example: RD }
                            LineCode2: { type: string, nullable: true, example: null }
                            LineCode3: { type: string, nullable: true, example: null }
                            LineCode4: { type: string, nullable: true, example: null }
                            Address:
                              type: object
                              properties:
                                Street: { type: string, example: 607 13th St. NW }
                                City: { type: string, example: Washington }
                                State: { type: string, example: DC }
                                Zip: { type: string, example: "20005" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /lines:
    get:
      operationId: getLines
      summary: Lines
      responses:
        "200":
          description: GeoJSON FeatureCollection, one line string per Metrorail line
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string, example: FeatureCollection }
                  features:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string, example: Feature }
                        geometry:
                          type: object
                          properties:
                            type: { type: string, example: LineString }
                            coordinates:
                              type: array
                              items: { type: array, items: { type: number } }
                        properties:
                          type: object
                          properties:
                            NAME:
                              type: string
                              enum: [red, orange, blue, green, yellow, silver]
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /fares/{station_code}:
    get:
      operationId: getFares
      summary: Fares from a station
      description: Fares from the station to every station, keyed by destination code. The origin and its other platform at a transfer station are `0`.
      parameters:
        - name: station_code
          in: path
          required: true
          description: A letter and two digits (any case)
          schema: { type: string, pattern: "^[A-Za-z]\\d{2}$", example: A01 }
      responses:
        "200":
          description: Destination code to fare
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { $ref: "#/components/schemas/Fare" }
                example:
                  A02: { PeakTime: 2.0, OffPeakTime: 2.0, SeniorDisabled: 1.1, RailTime: 2, CompositeMiles: 0.75 }
                  A01: { PeakTime: 0.0, OffPeakTime: 0.0, SeniorDisabled: 0.0, RailTime: 0, CompositeMiles: 0.0 }
        "400":
          description: Not a letter and two digits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /route/{from}/{to}:
    get:
      operationId: getRoute
      summary: Fastest route between two stations
      description: "Legs in riding order; an empty list means both codes are the same station. Each leg is one stretch of track and names every line that covers it, with the end station it heads toward. A line change costs 5 minutes when picking the route; the fare and time for the whole trip are in `/fares/{from}`."
      parameters:
        - name: from
          in: path
          required: true
          schema: { type: string, pattern: "^[A-Za-z]\\d{2}$", example: A15 }
        - name: to
          in: path
          required: true
          schema: { type: string, pattern: "^[A-Za-z]\\d{2}$", example: C05 }
      responses:
        "200":
          description: Legs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    stations:
                      type: array
                      description: Platform codes from boarding to leaving the train
                      items: { type: string }
                    lines:
                      type: array
                      items:
                        type: object
                        properties:
                          line: { type: string, enum: [RD, OR, BL, GR, YL, SV] }
                          toward: { type: string, description: Code of the end station the train heads toward }
              example:
                - stations: [A15, A14, A13, A12, A11, A10, A09, A08, A07, A06, A05, A04, A03, A02, A01]
                  lines: [{ line: RD, toward: B11 }]
                - stations: [C01, C02, C03, C04, C05]
                  lines: [{ line: BL, toward: J03 }, { line: OR, toward: K08 }, { line: SV, toward: N12 }]
        "400":
          description: Not a letter and two digits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
